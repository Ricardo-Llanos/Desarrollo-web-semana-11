<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %} Primer Proyecto en DJango {% endblock %}</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="bg-gray-50 text-gray-800 flex flex-col min-iter-screen">
        <!-- Header (Información General) -->
        <header class="bg-blue-600 text-white shadow-md p-4">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">UNCP - Ingeniería de Sistemas</h1>
                <nav class="space-x-4">
                    <a href="{% url 'tienda:home' %}" class="hover:underline">Inicio</a>
                    <a href="{% url 'tienda:catalogo' %}" class="hover:underline">Catálogo</a>
                </nav>
            </div>
        </header>

        <!-- Bienvenida -->
        <main class="container mx-auto flex-grow p-6">
            {% block content %}
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-2">Página de Inicio</h2>
                    <p class="text-gray-600">{{ mensaje_bienvenida }}</p>
                </div>
            {% endblock %}
        </main>

        <!-- Curso -->
        <footer class="bg-gray-800 text-gray-400 text-center p-4 mt-auto">
            <p>&copy; 2026 - Desarrollo de Aplicaciones Web (Semana 11)</p>
        </footer>
    </body>
</html>
