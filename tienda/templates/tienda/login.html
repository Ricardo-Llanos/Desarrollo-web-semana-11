{% extends 'tienda/base.html' %}

{% block title %}Iniciar Sesión - UNCP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl shadow-md border border-gray-100">
    
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Control de Acceso</h2>
        <p class="text-sm text-gray-500 mt-1">Identifícate para gestionar el catálogo del sistema</p>
    </div>

    {% if messages %}
        <div class="mb-4 space-y-2">
            {% for message in messages %}
                <div class="p-3 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-50 border-l-4 border-red-500 text-red-700{% else %}bg-green-50 border-l-4 border-green-500 text-green-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %} <div class="mb-4">
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                Nombre de Usuario
            </label>
            <input 
                type="text" 
                name="username" 
                id="username" 
                required 
                class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" 
                placeholder="Ej. admin"
            >
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                Contraseña
            </label>
            <input 
                type="password" 
                name="password" 
                id="password" 
                required 
                class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" 
                placeholder="••••••••"
            >
        </div>

        <button 
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm"
        >
            Ingresar al Sistema
        </button>
    </form>

</div>
{% endblock %}
